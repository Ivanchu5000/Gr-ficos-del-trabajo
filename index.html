<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gráfica error π</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
  <div id = "contenedor">
    <label>Modo: </label>
    <select id = "selectModo">
      <option value = "normal" >Normal</option>
      <option value = "aproximacion" >Aproximación</option>
      <option value = "multiplos" >Múltiplos</option>
      <option value = "maximosRelativos">Máximos relativos</option>
      <option value = "grafico4">Gráfico 4</option>
    </select>
    <select class = "hidden" id = "selectMaximosRelativos">
        <option value = "normal">Máximos relativos</option>
        <option value = "anteriores">Números anteriores a máximos relativos</option>
        <option value = "posteriores">Números posteriores a máximos relativos</option>
    </select>
    <input type = "number" placeholder = "Mínimo" id = "minimo">
    <input type = "number" class = "hidden" id = "txtMultiplo" placeholder = "Múltiplos de...">
    
    <input type = "number" placeholder = "Máximo" id = "maximo">

    <button type="button" onclick="crearGrafico()">Error pi</button>
    <button type="button" onclick="reset()">Resetear</button>
  </div>
  <br>
  <h1>Gráfica de Error Relativo</h1>
  <canvas id="myChart" width="400" height="200"></canvas>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>
</html>
